apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: udn-cnc-cudn-{{.Iteration}}
  labels:
    {{- if eq (.MODE | default "pair") "pair" }}
    {{- $pairIdx := div .Iteration 2 }}
    udn-cnc-pair-{{$pairIdx}}: ""
    {{- else }}
    udn-cnc-mesh: ""
    {{- end }}
spec:
  {{- $nsName := print "udn-cnc-" .Iteration }}
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values: ["{{$nsName}}"]
  {{- $cudnCidr := "" }}
  {{- if eq (.MODE | default "pair") "pair" }}
  {{- $pairIdx := div .Iteration 2 }}
  {{- $side := mod .Iteration 2 }}
  {{- $baseOctet := 40 }}
  {{- if eq $side 1 }}{{- $baseOctet = 50 }}{{- end }}
  {{- $firstOctet := add (div $pairIdx 256) $baseOctet }}
  {{- $secondOctet := mod $pairIdx 256 }}
  {{- $cudnCidr = print $firstOctet "." $secondOctet ".0.0/16" }}
  {{- else }}
  {{- $firstOctet := add (div .Iteration 256) 40 }}
  {{- $secondOctet := mod .Iteration 256 }}
  {{- $cudnCidr = print $firstOctet "." $secondOctet ".0.0/16" }}
  {{- end }}
  network:
    topology: {{.TOPOLOGY | default "Layer2"}}
    {{- if eq (.TOPOLOGY | default "Layer2") "Layer2" }}
    layer2:
      role: Primary
      subnets:
        - "{{$cudnCidr}}"
    {{- else }}
    layer3:
      role: Primary
      subnets:
        - cidr: {{$cudnCidr}}
          hostSubnet: 24
    {{- end }}
