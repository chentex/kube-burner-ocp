apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: udn-cnc-cudn-{{.Iteration}}
  labels:
    {{- $k := .Iteration | int}}
    {{- $meshSize := .MESH_SIZE | int}}
    {{- $group := div $k $meshSize}}
    {{- $local := mod $k $meshSize}}
    udn-cnc-group-{{$group}}: ""
    {{- if eq (.MODE | default "pair") "pair"}}
    {{- $pairIdx := div $local 2}}
    udn-cnc-pair-{{$group}}-{{$pairIdx}}: ""
    {{- else if eq (.MODE | default "pair") "multiply"}}
    {{- range $j := until $meshSize}}
    {{- if lt $j $local}}
    udn-cnc-multiply-{{$group}}-{{$j}}-{{$local}}: ""
    {{- else if gt $j $local}}
    udn-cnc-multiply-{{$group}}-{{$local}}-{{$j}}: ""
    {{- end}}
    {{- end}}
    {{- end}}
spec:
  {{- $nsName := print "udn-cnc-" .Iteration }}
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values: ["{{$nsName}}"]
  {{- $firstOctet := add (div $k 256) 40}}
  {{- $secondOctet := mod $k 256}}
  {{- $cudnCidr := print $firstOctet "." $secondOctet ".0.0/16"}}
  network:
    topology: {{.TOPOLOGY | default "Layer2"}}
    {{- if eq (.TOPOLOGY | default "Layer2") "Layer2" }}
    layer2:
      role: Primary
      subnets:
        - "{{$cudnCidr}}"
    {{- else }}
    layer3:
      role: Primary
      subnets:
        - cidr: {{$cudnCidr}}
          hostSubnet: 24
    {{- end }}
