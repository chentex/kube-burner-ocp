kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-nginx-ingress
spec:
  podSelector:
    matchLabels:
      app: nginx
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 5201
    - protocol: UDP
      port: 5201
    - protocol: TCP
      port: 12865
  policyTypes:
  - Ingress
