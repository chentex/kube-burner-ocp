{{- $allPairs := .PAIRS_JSON | fromJson}}
{{- $pair := index $allPairs (default 0 .Iteration)}}
{{- $meshIdx := index $pair 0 | int}}
{{- $nsI := index $pair 1 | int}}
{{- $nsJ := index $pair 2 | int}}
apiVersion: k8s.ovn.org/v1
kind: ClusterNetworkConnect
metadata:
  name: udn-cnc-cnc-{{.Iteration}}
spec:
  networkSelectors:
    - networkSelectionType: ClusterUserDefinedNetworks
      clusterUserDefinedNetworkSelector:
        networkSelector:
          matchLabels:
            udn-cnc-multiply-{{$meshIdx}}-{{$nsI}}-{{$nsJ}}: ""
  {{- $firstOctet := add (div .Iteration 256) 60 }}
  {{- $secondOctet := mod .Iteration 256 }}
  {{- $cncCidr := print $firstOctet "." $secondOctet ".0.0/16" }}
  connectSubnets:
  - cidr: "{{$cncCidr}}"
    networkPrefix: 24
  connectivity:
  {{- $connectivityList := splitList "," .connectivity }}
  {{- range $connectivityList }}
    - {{ . | trim }}
  {{- end }}
